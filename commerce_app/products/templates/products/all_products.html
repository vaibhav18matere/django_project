{% extends 'layout.html' %}

{% block title %}All Products{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">
            All Products
        </h1>
    </div>

    <!-- Products Grid -->
    <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

            {% for chai in chais %}
                <div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl border border-gray-100 overflow-hidden transition-all duration-300 hover:-translate-y-1">
                    <div class="relative h-64 bg-gray-100 overflow-hidden">
                        <img
                            src="{{ chai.image.url }}"
                            alt="{{ chai.name }}"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        >
                    </div>
                    <div class="p-5">
                        <h2 class="text-lg font-semibold text-gray-900 group-hover:text-green-700 transition-colors">
                            {{chai.id}}. {{ chai.name }} 
                        </h2>
                        <p class="text-green-700 text-md font-bold mt-2">
                            Price: Rs. {{ chai.price }}
                        </p>
                        <div class="mt-5">
                            <a
                                href="{% url 'chai_details' chai.id %}"
                                class="inline-flex items-center justify-center w-full rounded-xl bg-green-600 px-4 py-3 text-sm font-semibold text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors"
                            >
                                View Details
                                <span class="ml-2" aria-hidden="true">&rarr;</span>
                            </a>
                        </div>
                    </div>

                </div>
            {% empty %}
                <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">
                        No products available
                    </h2>
                </div>
            {% endfor %}

        </div>
    </div>

</div>
{% endblock %}
