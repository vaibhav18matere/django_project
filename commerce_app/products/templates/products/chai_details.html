{% extends 'layout.html' %}

{% block title %}{{ chai.name }} Product Details{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-7xl mx-auto">
        <nav class="mb-8 text-sm text-gray-500">
            <a href="/" class="hover:text-green-700 transition-colors">Home</a>
            <span class="mx-2">/</span>
            <a href="#" class="hover:text-green-700 transition-colors">Products</a>
            <span class="mx-2">/</span>
            <span class="text-gray-900 font-medium">{{ chai.name }}</span>
        </nav>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-0">
                <div class="bg-gray-100 p-6 sm:p-10 flex items-center justify-center">
                    <div class="w-full max-w-xl overflow-hidden rounded-2xl bg-white shadow-sm">
                        <img
                            src="{{ chai.image.url }}"
                            alt="{{ chai.name }}"
                            class="w-full h-80 sm:h-125 object-cover hover:scale-105 transition-transform duration-500"
                        >
                    </div>
                </div>

                <div class="p-6 sm:p-10 lg:p-12 flex flex-col justify-center">
                    <h1 class="mt-5 text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
                        {{ chai.name }}
                    </h1>
                    <h3 class="text-green-700 text-2xl font-bold mt-2">
                        Price: Rs. {{ chai.price }}
                    </h3>
                    <div class="mt-8 border-t border-gray-100 pt-6">
                        <h2 class="text-lg font-semibold text-gray-900">
                            Description
                        </h2>
                        <p class="mt-3 text-base leading-7 text-gray-600">
                            {{ chai.description }}
                        </p>
                    </div>

                    <a href="{% url 'all_products' %}" class="mt-4 inline-flex items-center justify-center w-full rounded-xl bg-green-600 px-4 py-3 text-sm font-semibold text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
                        Back to All Products
                    </a>

                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
